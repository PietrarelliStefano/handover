[project]
name = "handover"
version = "0.1.0"
description = "Pipeline locale: shooting immobiliare → foto HDR e reel 9:16"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
handover = "handover.cli:app"

[dependency-groups]
dev = ["pytest>=8"]
# Solo per lo spike, e solo sul Mac (Apple Silicon): `uv sync --group spike`
spike = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "ocrmac>=1.0; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["archive: usa l'archivio reale su /Volumes/WORK (saltato se non montato)"]
addopts = "-m 'not archive'"
